<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAPUR KILAT — Warung Rush</title>
<style>
  html, body { margin: 0; padding: 0; background: #17100a; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    color: #fff7e6;
  }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 2px; color: #ffd94d; }
  canvas {
    width: min(1280px, 96vw);
    height: auto;
    background: #0f766e;
    border: 4px solid #8b5a2b;
    border-radius: 12px;
    display: block;
  }
  #status {
    margin-top: 10px;
    font-size: 14px;
    color: #e8dcc3;
    min-height: 20px;
    text-align: center;
  }
  .keys { font-size: 13px; color: #b8a888; margin-top: 4px; text-align: center; }
</style>
</head>
<body>
<h1>DAPUR KILAT</h1>
<canvas id="game" width="1280" height="720"></canvas>
<div id="status">DAPUR KILAT — memuat warung...</div>
<div class="keys">WASD / panah: jalan &nbsp;•&nbsp; E / Spasi: ambil &amp; pakai (tahan untuk cincang) &nbsp;•&nbsp; Klik: jalan &amp; pakai &nbsp;•&nbsp; P: jeda &nbsp;•&nbsp; M: suara</div>
<noscript><p style="color:#ffd94d">DAPUR KILAT butuh JavaScript untuk dimainkan.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
